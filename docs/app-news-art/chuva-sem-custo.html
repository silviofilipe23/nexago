<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="art.css">
<style>
  :root { --rain:#5AA9FF; --rainText:#8CC4FF; }
  .art { background: radial-gradient(70% 60% at 50% 52%, rgba(90,169,255,.22), rgba(90,169,255,0) 70%), #070708; }
  .tile { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex-shrink: 0; background: rgba(90,169,255,.16); }
  .strip { display: flex; gap: 5px; margin-top: 10px; }
  .cell { flex: 1; border-radius: 9px; background: rgba(255,255,255,.04); padding: 6px 0 5px; text-align: center; }
  .cell.on { background: rgba(90,169,255,.18); }
  .cell b { display: block; font-family: JB; font-size: 10px; color: var(--rainText); }
  .cell span { display: block; font-size: 8px; color: var(--dim); margin-top: 2px; }
  .opt { display: flex; align-items: center; gap: 8px; border-radius: 12px; padding: 8px 10px; background: var(--surf); border: 1px solid var(--line); box-shadow: 0 14px 30px rgba(0,0,0,.55); }
  .tag { font-family: JB; font-size: 7px; letter-spacing: .1em; padding: 2px 5px; border-radius: 5px; background: rgba(43,209,126,.16); color: var(--win); }
</style></head>
<body><div class="art">
  <!-- Modo chuva ativo -->
  <div class="abs card" style="left:58px; width:274px; top:84px; padding:13px; background:linear-gradient(135deg, rgba(90,169,255,.20), #121214 70%); border-color:rgba(90,169,255,.30);">
    <div style="display:flex; gap:10px; align-items:center;">
      <div class="tile">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8CC4FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15.5a4.5 4.5 0 0 1 1.1-8.9A5.5 5.5 0 0 1 18.5 8a3.8 3.8 0 0 1-.5 7.5Z"/><path d="M8 18.5 7 21M12 18.5 11 21M16 18.5 15 21"/></svg>
      </div>
      <div>
        <div class="kicker" style="color:var(--rainText);">Modo chuva ativo</div>
        <div style="font-size:13px; font-weight:800; letter-spacing:-.02em; margin-top:3px;">Chuva forte às 18h</div>
      </div>
    </div>
    <div style="font-size:9.5px; color:rgba(247,247,248,.8); margin-top:9px; line-height:1.45;">A Arena Pé na Areia liberou seu horário. Remarque ou guarde o valor como crédito, sem custo.</div>
    <div class="strip">
      <div class="cell"><b>60%</b><span>16h</span></div>
      <div class="cell"><b>85%</b><span>17h</span></div>
      <div class="cell on"><b>92%</b><span>18h</span></div>
      <div class="cell"><b>88%</b><span>19h</span></div>
      <div class="cell"><b>70%</b><span>20h</span></div>
    </div>
  </div>

  <!-- as duas saídas -->
  <div class="abs opt" style="left:58px; top:240px; width:133px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF6A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>
    <div><div style="font-size:10px; font-weight:700;">Remarcar</div><div class="tag" style="margin-top:3px; display:inline-block;">SEM CUSTO</div></div>
  </div>
  <div class="abs opt" style="left:199px; top:240px; width:133px; border-color:rgba(255,106,26,.45);">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF6A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 14.5h2"/></svg>
    <div><div style="font-size:10px; font-weight:700;">Guardar crédito</div><div style="font-size:9px; color:var(--dim); margin-top:2px;">R$ 70,00</div></div>
  </div>
</div></body></html>
