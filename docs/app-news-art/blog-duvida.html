<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="art.css">
<style>
  .t { font-size: 12px; font-weight: 800; letter-spacing: -.02em; }
  .s { font-size: 9px; color: var(--dim); line-height: 1.35; }
  .pill { height: 16px; border-radius: 99px; padding: 0 7px; display: inline-flex; align-items: center; font-family: JB; font-weight: 700; font-size: 6.5px; letter-spacing: .12em; }
  .p-or { background: rgba(255,106,26,.12); border: 1px solid rgba(255,106,26,.32); color: var(--or); }
  .sel { border-color: rgba(255,106,26,.55); box-shadow: 0 0 0 4px rgba(255,106,26,.10), 0 18px 44px rgba(0,0,0,.6); }
  .tap { position: absolute; font-size: 30px; color: #F7F7F8; text-shadow: 0 6px 18px rgba(0,0,0,.75); }
</style></head>
<body><div class="art">

  <div class="abs card" style="left:57px; top:86px; width:276px; padding:12px;">
    <div class="t" style="font-size:11.5px;">Esse post te ajudou?</div>
    <div style="display:flex; gap:8px; margin-top:9px;">
      <div class="btn ghost" style="flex:1;"><span class="i" style="font-size:13px;">&#xf440;</span>Ajudou · 12</div>
      <div class="btn" style="flex:1;"><span class="i" style="font-size:13px;">&#xe155;</span>Ficou dúvida</div>
    </div>
  </div>
  <span class="tap i" style="left:300px; top:136px;">&#xe670;</span>

  <div class="abs card sel" style="left:57px; top:170px; width:276px; padding:11px 12px;">
    <div style="display:flex; align-items:center; gap:7px;">
      <div class="av" style="width:22px;height:22px;font-size:9px;background:#8AB4FF;">A</div>
      <div class="t" style="font-size:10px;">Ana S.</div>
      <span class="pill p-or" style="margin-left:auto;">DÚVIDA</span>
    </div>
    <div class="s" style="color:var(--fg); margin-top:6px;">Na 2ª etapa a dupla pode trocar de categoria?</div>
    <div style="margin-top:8px; padding:8px 10px; border-radius:12px; background:rgba(255,106,26,.08); border:1px solid rgba(255,106,26,.22);">
      <div class="kicker" style="color:var(--or);">Resposta da equipe nexaGO</div>
      <div class="s" style="color:var(--fg); margin-top:4px;">Pode, até o fim das inscrições: é só falar com o organizador.</div>
    </div>
  </div>
</div></body></html>
