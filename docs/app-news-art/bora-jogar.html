<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="art.css">
<style>
  .row { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--dim); margin-top: 6px; }
  .row .i { font-size: 13px; color: var(--or); }
  .toast { height: 28px; border-radius: 99px; background: rgba(43,209,126,.14); border: 1px solid rgba(43,209,126,.35); color: var(--win); font-size: 10.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; }
</style></head>
<body><div class="art">
  <!-- quadra de areia ao fundo -->
  <svg class="abs" style="inset:0" width="390" height="380" viewBox="0 0 390 380">
    <g stroke="rgba(255,106,26,.13)" stroke-width="2" fill="none">
      <path d="M40 360 L120 40 L270 40 L350 360 Z"/>
      <path d="M80 200 L310 200"/>
    </g>
    <path d="M70 196 L320 196 L320 204 L70 204 Z" fill="rgba(255,255,255,.05)"/>
  </svg>

  <!-- abas do Bora Jogar (aparecem no detalhe e nos stories) -->
  <div class="abs" style="left:58px; top:56px; display:flex; gap:6px;"><span class="chip on">Convites</span><span class="chip">Jogos</span><span class="chip">Histórico</span></div>

  <div class="abs" style="left:0; right:0; top:93px; text-align:center;">
    <span class="toast"><span class="i" style="font-size:14px">&#xf635;</span>Deu match! Jogo confirmado 🎉</span>
  </div>

  <!-- convite -->
  <div class="abs card" style="left:58px; width:274px; top:129px; padding:12px 13px;">
    <div class="kicker">Convite para jogar</div>
    <div style="display:flex; align-items:center; gap:10px; margin-top:9px;">
      <div class="av" style="width:36px; height:36px; background:#8AB4FF; font-size:12px;">LA</div>
      <div>
        <div style="font-size:13.5px; font-weight:800; letter-spacing:-.02em;">Lucas Andrade</div>
        <div style="font-size:10px; color:var(--dim); margin-top:1px;">te chamou pra jogar</div>
      </div>
    </div>
    <div style="display:flex; gap:14px; margin-top:2px;">
      <div class="row"><span class="i">&#xf01c9;</span>Vôlei de praia</div>
      <div class="row"><span class="i">&#xf5fe;</span>Sáb, 16:00</div>
    </div>
    <div class="row" style="margin-top:4px;"><span class="i">&#xf009e;</span>Arena Pé na Areia</div>
    <div style="display:flex; gap:8px; margin-top:10px;">
      <div class="btn ghost" style="flex:1; padding:0 8px;">Sugerir horário</div>
      <div class="btn" style="flex:1;">Aceitar <span class="i" style="font-size:13px">&#xf57a;</span></div>
    </div>
  </div>

  <div class="abs" style="left:0; right:0; top:304px; text-align:center;">
    <span class="chip" style="height:26px; color:var(--or); border-color:rgba(255,106,26,.4); background:rgba(255,106,26,.08); font-size:10px;"><span class="i" style="font-size:13px">&#xf8f0;</span>Fazer check-in — cheguei!</span>
  </div>
</div></body></html>
