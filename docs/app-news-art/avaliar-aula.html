<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="art.css">
<style>
  .t { font-size: 13px; font-weight: 800; letter-spacing: -.02em; }
  .s { font-size: 9.5px; color: var(--dim); margin-top: 2px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .ic { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: rgba(255,106,26,.12); color: var(--or); flex-shrink: 0; }
  .ic .i { font-size: 17px; }
  .mono { font-family: JB; font-weight: 700; }
  .pill { height: 20px; border-radius: 99px; padding: 0 8px; display: inline-flex; align-items: center; gap: 4px; font-family: JB; font-weight: 700; font-size: 7.5px; letter-spacing: .12em; }
  .p-or { background: rgba(255,106,26,.12); border: 1px solid rgba(255,106,26,.32); color: var(--or); }
  .p-win { background: rgba(43,209,126,.12); border: 1px solid rgba(43,209,126,.32); color: var(--win); }
  .p-gold { background: rgba(244,197,67,.12); border: 1px solid rgba(244,197,67,.32); color: #F4C543; }
  .p-red { background: rgba(255,59,48,.12); border: 1px solid rgba(255,59,48,.32); color: #FF5A50; }
  .sel { border-color: rgba(255,106,26,.55); box-shadow: 0 0 0 4px rgba(255,106,26,.10), 0 18px 44px rgba(0,0,0,.6); }
  .tap { position: absolute; font-size: 30px; color: #F7F7F8; text-shadow: 0 6px 18px rgba(0,0,0,.75); }
  .div { height: 1px; background: var(--line); margin: 10px 0; }

  .b { position:absolute; left:57px; width:276px; padding:14px; }
  .stars { display:flex; gap:4px; margin-top:6px; }
  .stars .i { font-size:22px; color:#F4C543; }
  .stars .off { color:var(--dim2); }
  .tag { height:22px; border-radius:99px; padding:0 9px; display:inline-flex; align-items:center; font-size:9px; font-weight:600; border:1px solid var(--line); background:var(--surf2); color:var(--dim); }
  .tag.on { border-color:rgba(255,106,26,.5); color:var(--or); background:rgba(255,106,26,.1); }

</style></head>
<body><div class="art">

  <div class="b card sel" style="top:66px;">
    <div class="kicker">Como foi o treino?</div>
    <div class="t" style="margin-top:4px;">Turma Intermediário · ontem</div>
    <div class="s" style="margin-top:10px;">Aula</div>
    <div class="stars"><span class="i">&#xe5f9;</span><span class="i">&#xe5f9;</span><span class="i">&#xe5f9;</span><span class="i">&#xe5f9;</span><span class="i">&#xe5f9;</span></div>
    <div class="s" style="margin-top:8px;">Professor</div>
    <div class="stars"><span class="i">&#xe5f9;</span><span class="i">&#xe5f9;</span><span class="i">&#xe5f9;</span><span class="i">&#xe5f9;</span><span class="i off">&#xe5fa;</span></div>
    <div style="display:flex; gap:5px; flex-wrap:wrap; margin-top:10px;"><span class="tag on">Didático</span><span class="tag on">Pontual</span><span class="tag">Treino puxado</span></div>
    <div class="btn" style="margin-top:12px; height:34px;">Enviar avaliação</div>
  </div>
</div></body></html>
