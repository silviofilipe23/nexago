<section class="auth-shell">
  <aside class="auth-brand">
    <div class="auth-brand-glow" aria-hidden="true"></div>
    <svg class="auth-brand-court" width="520" height="520" viewBox="0 0 520 520" fill="none" aria-hidden="true">
      <circle cx="260" cy="260" r="200" stroke="#FF6A1A" stroke-width="1.5" />
      <circle cx="260" cy="260" r="140" stroke="#FF6A1A" stroke-width="1.5" />
      <line x1="0" y1="260" x2="520" y2="260" stroke="#FF6A1A" stroke-width="1.5" />
      <line x1="260" y1="0" x2="260" y2="520" stroke="#FF6A1A" stroke-width="1.5" />
    </svg>

    <div class="auth-mark-row">
      <div class="auth-mark" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
          <path d="M5 4 L5 20 M19 4 L19 20 M5 4 L19 20" stroke="#0A0A0A" stroke-width="3.4" stroke-linecap="square" stroke-linejoin="miter" />
        </svg>
      </div>
      <div class="auth-wordmark">
        <div class="auth-wordmark-title">nexa<span>GO</span></div>
        <div class="auth-wordmark-caption">Área do atleta</div>
      </div>
    </div>

    <div class="auth-brand-spacer"></div>

    <div class="auth-brand-message">
      <div class="auth-brand-kicker">Sua conta NexaGO</div>
      <h2>Sua quadra,<br />seu jogo, seu ritmo.</h2>
      <p>
        Reserve horários, entre em torneios e ligas, acompanhe sua agenda e sua evolução — tudo o
        que tem no app, agora também no navegador.
      </p>
    </div>

    <div class="auth-brand-footer">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3 4.5 6v5.5c0 4.6 3.2 7.8 7.5 9.5 4.3-1.7 7.5-4.9 7.5-9.5V6L12 3z" />
      </svg>
      Seus dados, sua privacidade
    </div>
  </aside>

  <div class="auth-content">
    <a routerLink="/" class="auth-back auth-back--mobile">← Início</a>
    <div class="auth-content-glow" aria-hidden="true"></div>
    <div class="auth-content-inner">
      <ng-content></ng-content>
    </div>
  </div>
</section>
