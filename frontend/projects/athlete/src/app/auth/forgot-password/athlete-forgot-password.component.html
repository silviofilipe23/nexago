<app-auth-shell>
  <a class="nx-back-link" routerLink="/entrar" [queryParams]="{ redirect: returnUrl }">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M12 19l-7-7 7-7" />
    </svg>
    Voltar pro login
  </a>

  <header class="nx-form-header">
    <div class="nx-kicker">Recuperar acesso</div>
    <h1>Esqueceu a senha?</h1>
    <p>Sem drama. Informa teu e-mail e a gente manda um link pra redefinir.</p>
  </header>

  @if (authError(); as err) {
    <div class="nx-alert" role="alert">{{ err }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label class="nx-field">
      <span class="nx-field-label">E-mail</span>
      <span class="nx-field-box" [class.nx-field-box--error]="form.controls.email.invalid && form.controls.email.touched">
        <input type="email" formControlName="email" autocomplete="email" inputmode="email" placeholder="voce@email.com" />
      </span>
      @if (form.controls.email.touched && form.controls.email.errors?.['required']) {
        <span class="nx-field-msg nx-field-msg--error">Obrigatório</span>
      }
      @if (form.controls.email.touched && form.controls.email.errors?.['email']) {
        <span class="nx-field-msg nx-field-msg--error">E-mail inválido</span>
      }
    </label>

    <button type="submit" class="nx-btn-primary" style="margin-top: 24px" [disabled]="submitting() || !firebaseConfigured()">
      @if (submitting()) {
        <span class="nx-spinner" aria-hidden="true"></span>
        <span>Enviando…</span>
      } @else {
        <span>Enviar link de redefinição</span>
      }
    </button>
  </form>

  <p class="nx-fine">O link expira em 1 hora e só funciona uma vez.</p>
</app-auth-shell>
