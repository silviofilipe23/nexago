<div class="focus">
  <header class="focus__header">
    <button type="button" class="focus__exit" aria-label="Sair do Focus" (click)="exit()">×</button>
    <div class="focus__title">
      <span class="focus__badge" [class.focus__badge--live]="hasLive()">Focus</span>
      <strong>{{ store.tournament()?.name ?? 'Torneio' }}</strong>
      @if (headerMeta(); as meta) {
        <span class="focus__meta">{{ meta }}</span>
      }
    </div>
    @if (canChooseCategory()) {
      <!-- Quem joga duas categorias escolhe qual o Focus mostra; sem isto a outra ficava
           inalcançável (o Focus segue a da próxima partida). -->
      <select
        class="focus__category"
        aria-label="Trocar categoria"
        data-testid="focus-category-select"
        (change)="onCategoryChange($event)"
      >
        @for (category of store.myFocusCategories(); track category.id) {
          <option [value]="category.id" [selected]="category.id === store.focusCategoryId()">
            {{ category.categoryName }}{{ category.id === store.focusAutoCategoryId() ? ' · próxima partida' : '' }}
          </option>
        }
      </select>
    }
    <!-- <time class="focus__clock">{{ clock() }}</time> -->
  </header>

  <nav class="focus__nav" aria-label="Seções do Focus">
    @for (section of sections; track section.id) {
      <a
        [routerLink]="['./', section.id]"
        class="focus__tab"
        [class.focus__tab--active]="activeSection() === section.id"
        [attr.aria-current]="activeSection() === section.id ? 'page' : null"
      >
        {{ section.label }}
      </a>
    }
  </nav>

  <main class="focus__content">
    @if (store.loading()) {
      <app-nx-page-loading title="Carregando torneio…" />
    } @else {
      <router-outlet />
    }
  </main>
</div>
