@for (b of current(); track b.id) {
  <section class="lj-banner" [attr.aria-label]="'Campanha: ' + b.title" aria-roledescription="carrossel">
    <div class="lj-banner-copy">
      @if (b.kicker) {
        <div class="lj-banner-kicker">{{ b.kicker }}</div>
      }
      <h2 class="lj-banner-title">{{ b.title }}</h2>
      @if (b.subtitle) {
        <p class="lj-banner-subtitle">{{ b.subtitle }}</p>
      }
      <div class="lj-banner-actions">
        <button type="button" class="lj-btn lj-btn--primary" (click)="primaryClick.emit(b)">{{ b.primary.label }}</button>
        @if (b.secondary; as sec) {
          <button type="button" class="lj-btn lj-btn--ghost" (click)="secondaryClick.emit(b)">{{ sec.label }}</button>
        }
      </div>
      @if (banners().length > 1) {
        <div class="lj-banner-dots" role="tablist" aria-label="Escolher campanha">
          @for (item of banners(); track item.id; let i = $index) {
            <button
              type="button"
              role="tab"
              class="lj-banner-dot"
              [class.lj-banner-dot--on]="item.id === b.id"
              [attr.aria-selected]="item.id === b.id"
              [attr.aria-label]="'Campanha ' + (i + 1) + ': ' + item.title"
              (click)="go(i)"
            ></button>
          }
        </div>
      }
    </div>
    <div class="lj-banner-media" aria-hidden="true">
      @if (b.imageUrl; as img) {
        <img [src]="img" alt="" />
      }
    </div>
  </section>
}
