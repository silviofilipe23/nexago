<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="art.css">
<style>
  .t { font-size: 13px; font-weight: 800; letter-spacing: -.02em; }
  .s { font-size: 9.5px; color: var(--dim); margin-top: 2px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .ic { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: rgba(255,106,26,.12); color: var(--or); flex-shrink: 0; }
  .ic .i { font-size: 17px; }
  .mono { font-family: JB; font-weight: 700; }
  .pill { height: 20px; border-radius: 99px; padding: 0 8px; display: inline-flex; align-items: center; gap: 4px; font-family: JB; font-weight: 700; font-size: 7.5px; letter-spacing: .12em; }
  .p-or { background: rgba(255,106,26,.12); border: 1px solid rgba(255,106,26,.32); color: var(--or); }
  .p-win { background: rgba(43,209,126,.12); border: 1px solid rgba(43,209,126,.32); color: var(--win); }
  .p-gold { background: rgba(244,197,67,.12); border: 1px solid rgba(244,197,67,.32); color: #F4C543; }
  .p-red { background: rgba(255,59,48,.12); border: 1px solid rgba(255,59,48,.32); color: #FF5A50; }
  .sel { border-color: rgba(255,106,26,.55); box-shadow: 0 0 0 4px rgba(255,106,26,.10), 0 18px 44px rgba(0,0,0,.6); }
  .tap { position: absolute; font-size: 30px; color: #F7F7F8; text-shadow: 0 6px 18px rgba(0,0,0,.75); }
  .div { height: 1px; background: var(--line); margin: 10px 0; }

  .prod { position:absolute; top:60px; width:132px; padding:10px; }
  .img { height:104px; border-radius:12px; display:grid; place-items:center; }
  .img .i { font-size:46px; }
  .price { font-family:JB; font-weight:700; font-size:13px; margin-top:4px; }

</style></head>
<body><div class="art">

  <div class="prod card" style="left:57px; opacity:.85;">
    <div class="img" style="background:linear-gradient(160deg,#1f2a44,#121214);color:#8AB4FF;"><span class="i">&#xe5f4;</span></div>
    <div class="t" style="font-size:11px;margin-top:8px;">Bola Pro Beach</div><div class="price">R$ 89,90</div>
    <div class="s">Retirada grátis na arena</div>
  </div>
  <div class="prod card sel" style="left:201px;">
    <div class="img" style="background:linear-gradient(160deg,#3a1a07,#121214);color:var(--or);position:relative;"><span class="i">&#xe59a;</span>
      <span class="mono" style="position:absolute;bottom:8px;font-size:12px;color:#fff;">SILVA 10</span></div>
    <div class="t" style="font-size:11px;margin-top:8px;">Camiseta nexaGO</div><div class="price" style="color:var(--or);">R$ 119,90</div>
    <div class="s">Personalizada</div>
  </div>
  <div class="abs card" style="left:57px; top:276px; width:276px; height:40px; padding:0 12px; display:flex; align-items:center; gap:8px;">
    <span class="i" style="color:var(--or);font-size:16px;">&#xe3a6;</span><span class="t" style="font-size:11px;">Arena ou em casa</span>
    <div class="btn" style="margin-left:auto; height:26px; font-size:9.5px; padding:0 10px;">Pagar com Pix</div></div>
</div></body></html>
