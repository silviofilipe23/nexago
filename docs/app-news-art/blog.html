<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="art.css">
<style>
  .t { font-size: 13px; font-weight: 800; letter-spacing: -.02em; }
  .s { font-size: 9px; color: var(--dim); margin-top: 3px; }
  .pill { height: 17px; border-radius: 99px; padding: 0 7px; display: inline-flex; align-items: center; font-family: JB; font-weight: 700; font-size: 7px; letter-spacing: .12em; }
  .p-solid { background: var(--or); color: #0A0A0A; }
  .p-or { background: #1A0E07; border: 1px solid rgba(255,106,26,.4); color: var(--or); }
  .p-win { background: rgba(43,209,126,.12); border: 1px solid rgba(43,209,126,.32); color: var(--win); }
  .sel { border-color: rgba(255,106,26,.55); box-shadow: 0 0 0 4px rgba(255,106,26,.10), 0 18px 44px rgba(0,0,0,.6); }

  .hero { position: absolute; left: 57px; top: 88px; width: 276px; height: 136px; border-radius: 18px; overflow: hidden;
    border: 1px solid var(--line); box-shadow: 0 18px 44px rgba(0,0,0,.6);
    background: url('../../nexago_app/assets/images/compete/blog.webp') center 40% / cover; }
  .hero::after { content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(5,5,5,0) 10%, rgba(5,5,5,.78) 55%, rgba(5,5,5,.95)); }
  .hero .in { position: absolute; left: 14px; right: 14px; bottom: 12px; z-index: 1; }
  .hero .t { font-size: 14px; line-height: 1.18; margin-top: 6px; }

  .row { position: absolute; left: 57px; top: 234px; width: 276px; height: 58px; padding: 0 10px; display: flex; align-items: center; gap: 10px; }
  .thumb { width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0;
    background: linear-gradient(135deg, #0F2A1C, #187345); display: grid; place-items: center; color: var(--win); }
</style></head>
<body><div class="art">

  <div class="abs" style="left:57px; top:58px; display:flex; gap:6px;">
    <span class="chip on">Todos</span><span class="chip">Torneios</span><span class="chip">Treino</span><span class="chip">Regras</span>
  </div>

  <div class="hero">
    <div class="in">
      <div style="display:flex; gap:5px;"><span class="pill p-solid">DESTAQUE</span><span class="pill p-or">TORNEIOS</span></div>
      <div class="t">Liga nexaGO: tudo sobre a 2ª etapa</div>
      <div class="s">4 min de leitura · Redação nexaGO</div>
    </div>
  </div>

  <div class="row card sel">
    <div class="thumb"><span class="i" style="font-size:18px;">&#xee93;</span></div>
    <div style="min-width:0;">
      <span class="pill p-win">TREINO</span>
      <div class="t" style="font-size:11px; margin-top:4px;">5 exercícios para melhorar o saque</div>
    </div>
    <span class="i" style="margin-left:auto; color:var(--or); font-size:20px;">&#xe0f1;</span>
  </div>
</div></body></html>
