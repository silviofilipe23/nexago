<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="art.css">
<style>
  .t { font-size: 13px; font-weight: 800; letter-spacing: -.02em; }
  .s { font-size: 9px; color: var(--dim); margin-top: 3px; }
  .pill { height: 17px; border-radius: 99px; padding: 0 7px; display: inline-flex; align-items: center; font-family: JB; font-weight: 700; font-size: 7px; letter-spacing: .12em; }
  .p-solid { background: var(--or); color: #0A0A0A; }
  .hub { position: absolute; left: 57px; top: 86px; width: 276px; height: 74px; border-radius: 18px; padding: 0 14px; display: flex; align-items: center; gap: 12px;
    border: 1px solid rgba(255,106,26,.45); box-shadow: 0 0 0 4px rgba(255,106,26,.08), 0 18px 44px rgba(0,0,0,.6);
    background: linear-gradient(120deg, #2A1206, #121214 70%); }
  .badge { width: 44px; height: 44px; border-radius: 14px; background: var(--or); color: #0A0A0A; display: grid; place-items: center; flex-shrink: 0; }
  .p { position: absolute; left: 57px; width: 276px; height: 58px; padding: 0 10px; display: flex; align-items: center; gap: 10px; }
  .logo { width: 38px; height: 38px; border-radius: 11px; flex-shrink: 0; display: grid; place-items: center; }
  .off { margin-left: auto; font-family: JB; font-weight: 700; font-size: 9px; color: var(--or); background: #1A0E07; border: 1px solid rgba(255,106,26,.4); border-radius: 99px; padding: 4px 8px; white-space: nowrap; }
  .sel { border-color: rgba(255,106,26,.55); box-shadow: 0 0 0 4px rgba(255,106,26,.10), 0 18px 44px rgba(0,0,0,.6); }
  .toast { position: absolute; left: 195px; transform: translateX(-50%); top: 300px; height: 26px; border-radius: 99px; padding: 0 12px; display: flex; align-items: center; gap: 6px;
    background: #0F2A1C; border: 1px solid rgba(43,209,126,.4); color: var(--win); font-size: 9.5px; font-weight: 700; white-space: nowrap; }
</style></head>
<body><div class="art">
  <div class="hub">
    <div class="badge"><span class="i" style="font-size:24px;">&#xf1a4;</span></div>
    <div style="min-width:0;">
      <span class="pill p-solid">NOVO</span>
      <div class="t" style="margin-top:5px;">Clube de Vantagens Nexa</div>
      <div class="s">Descontos dos parceiros NexaGO</div>
    </div>
  </div>
  <div class="p card sel" style="top:170px;">
    <div class="logo" style="background:linear-gradient(135deg,#3B0F3F,#7A2A86); color:#F2C6FA;"><span class="i" style="font-size:19px;">&#xf11d;</span></div>
    <div><div class="t" style="font-size:11px;">Açaí</div><div class="s">Alimentação · 1,2 km</div></div>
    <span class="off">10% OFF</span>
  </div>
  <div class="p card" style="top:234px;">
    <div class="logo" style="background:linear-gradient(135deg,#0F2A1C,#187345); color:var(--win);"><span class="i" style="font-size:19px;">&#xf01c8;</span></div>
    <div><div class="t" style="font-size:11px;">Arena</div><div class="s">Reserva de quadra</div></div>
    <span class="off">R$ 10 OFF</span>
  </div>
  <div class="toast"><span class="i" style="font-size:13px;">&#xf635;</span>Cupom copiado</div>
</div></body></html>
