<div class="at-shell">
  <aside class="at-sidebar">
    <div class="at-sidebar-brand">
      <div class="at-mark" aria-hidden="true">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
          <path d="M5 4 L5 20 M19 4 L19 20 M5 4 L19 20" stroke="#0A0A0A" stroke-width="3.4" stroke-linecap="square" stroke-linejoin="miter" />
        </svg>
      </div>
      <div class="at-sidebar-wordmark">
        <div class="at-sidebar-title">nexa<span>GO</span></div>
        <div class="at-sidebar-caption">Atleta</div>
      </div>
    </div>

    <nav class="at-nav">
      <div class="at-nav-label">Meu jogo</div>

      <a routerLink="/painel" routerLinkActive="at-nav-item--active" class="at-nav-item">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5" /><path d="M5 9.5V21h14V9.5" /><path d="M9 21v-6h6v6" /></svg>
        <span>Início</span>
      </a>
      <a routerLink="/agenda" routerLinkActive="at-nav-item--active" class="at-nav-item">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2" /><path d="M3 10h18M8 3v4M16 3v4" /></svg>
        <span>Agenda</span>
      </a>
      <span class="at-nav-item at-nav-item--disabled" aria-disabled="true" title="Em breve">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14" /></svg>
        <span>Reservar</span>
        <span class="at-nav-badge at-nav-badge--soon">Em breve</span>
      </span>
      <a routerLink="/torneios" routerLinkActive="at-nav-item--active" class="at-nav-item">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4" /><path d="M7 4h10v6a5 5 0 0 1-10 0V4z" /><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4" /></svg>
        <span>Competir</span>
      </a>
      <a routerLink="/perfil" routerLinkActive="at-nav-item--active" class="at-nav-item">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4" /><path d="M4 21c0-3.9 3.6-7 8-7s8 3.1 8 7" /></svg>
        <span>Perfil</span>
      </a>
    </nav>

    <div class="at-sidebar-spacer"></div>

    <span class="at-nav-item at-nav-item--disabled" aria-disabled="true" title="Em breve">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3" /><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1" /></svg>
      <span>Configurações</span>
    </span>

    <button type="button" class="at-nav-item at-nav-item--logout" (click)="logout()">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H5v16h4" /><path d="M14 8l4 4-4 4M18 12H9" /></svg>
      <span>Sair da conta</span>
    </button>

    <a routerLink="/perfil" class="at-user-chip">
      <span class="at-user-avatar">{{ initials() }}</span>
      <span class="at-user-info">
        <span class="at-user-name">{{ userName() }}</span>
        @if (userLevel(); as level) {
          <span class="at-user-level">{{ level }}</span>
        }
      </span>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="at-user-chevron"><path d="m9 6 6 6-6 6" /></svg>
    </a>
  </aside>

  <div class="at-main">
    <ng-content></ng-content>
  </div>

  <nav class="at-bottom-nav">
    <a routerLink="/painel" routerLinkActive="at-bottom-nav-item--active" class="at-bottom-nav-item">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5" /><path d="M5 9.5V21h14V9.5" /><path d="M9 21v-6h6v6" /></svg>
      <span>Início</span>
    </a>
    <a routerLink="/agenda" routerLinkActive="at-bottom-nav-item--active" class="at-bottom-nav-item">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2" /><path d="M3 10h18M8 3v4M16 3v4" /></svg>
      <span>Agenda</span>
    </a>
    <a routerLink="/torneios" routerLinkActive="at-bottom-nav-item--active" class="at-bottom-nav-item">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4" /><path d="M7 4h10v6a5 5 0 0 1-10 0V4z" /><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4" /></svg>
      <span>Competir</span>
    </a>
    <a routerLink="/perfil" routerLinkActive="at-bottom-nav-item--active" class="at-bottom-nav-item">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4" /><path d="M4 21c0-3.9 3.6-7 8-7s8 3.1 8 7" /></svg>
      <span>Perfil</span>
    </a>
  </nav>
</div>
