<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="art.css">
<style>
  .t { font-size: 13px; font-weight: 800; letter-spacing: -.02em; }
  .s { font-size: 9.5px; color: var(--dim); margin-top: 2px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .ic { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: rgba(255,106,26,.12); color: var(--or); flex-shrink: 0; }
  .ic .i { font-size: 17px; }
  .mono { font-family: JB; font-weight: 700; }
  .pill { height: 20px; border-radius: 99px; padding: 0 8px; display: inline-flex; align-items: center; gap: 4px; font-family: JB; font-weight: 700; font-size: 7.5px; letter-spacing: .12em; }
  .p-or { background: rgba(255,106,26,.12); border: 1px solid rgba(255,106,26,.32); color: var(--or); }
  .p-win { background: rgba(43,209,126,.12); border: 1px solid rgba(43,209,126,.32); color: var(--win); }
  .p-gold { background: rgba(244,197,67,.12); border: 1px solid rgba(244,197,67,.32); color: #F4C543; }
  .p-red { background: rgba(255,59,48,.12); border: 1px solid rgba(255,59,48,.32); color: #FF5A50; }
  .sel { border-color: rgba(255,106,26,.55); box-shadow: 0 0 0 4px rgba(255,106,26,.10), 0 18px 44px rgba(0,0,0,.6); }
  .tap { position: absolute; font-size: 30px; color: #F7F7F8; text-shadow: 0 6px 18px rgba(0,0,0,.75); }
  .div { height: 1px; background: var(--line); margin: 10px 0; }

  .pod { position:absolute; bottom:0; width:70px; border-radius:12px 12px 0 0; display:flex; flex-direction:column; align-items:center; padding-top:8px; background:var(--surf2); border:1px solid var(--line); border-bottom:none; }
  .pod .mono { font-size:13px; }
  .me { position:absolute; left:57px; top:246px; width:276px; height:46px; padding:0 12px; display:flex; align-items:center; gap:10px; }

</style></head>
<body><div class="art">

  <div class="abs" style="left:57px; top:58px; display:flex; gap:6px;"><span class="chip on">Atletas</span><span class="chip">Equipes</span><span class="chip"><span class="i" style="font-size:11px;">&#xe683;</span>Filtros</span></div>
  <div class="abs" style="left:57px; top:92px; width:276px; height:142px;">
    <div class="pod" style="left:26px; height:92px;"><div class="av" style="width:32px;height:32px;font-size:12px;background:#8AB4FF;">L</div><div class="t" style="font-size:10px;margin-top:5px;">Léo</div><div class="mono" style="color:var(--dim);">2º</div></div>
    <div class="pod" style="left:103px; height:122px; border-color:rgba(255,106,26,.45);"><span class="i" style="color:#F4C543;font-size:16px;">&#xe22c;</span><div class="av" style="width:38px;height:38px;font-size:14px;background:#F4C543;margin-top:2px;">C</div><div class="t" style="font-size:10px;margin-top:5px;">Caio</div><div class="mono" style="color:var(--or);">1º</div></div>
    <div class="pod" style="left:180px; height:78px;"><div class="av" style="width:30px;height:30px;font-size:11px;background:#2BD17E;">D</div><div class="t" style="font-size:10px;margin-top:5px;">Duda</div><div class="mono" style="color:var(--dim);">3º</div></div>
  </div>
  <div class="me card sel"><span class="mono" style="color:var(--or); font-size:15px;">#12</span><div class="av" style="width:28px;height:28px;font-size:11px;background:var(--or);">V</div>
    <div><div class="t" style="font-size:11.5px;">Você</div><div class="s">1.240 pts · Beach tennis</div></div><span class="i" style="margin-left:auto; color:var(--win); font-size:16px;">&#xe36f;</span></div>
</div></body></html>
